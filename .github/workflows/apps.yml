# Builds the Mac and Android apps into the one release "latest" (replaced each time, no version
# numbers to manage), with version.json for the apps' update check. Runs when the app code changes
# (mac/, android/) or by hand (Actions → Apps → Run workflow); the web page's changes don't.
name: Apps

on:
  push:
    branches: [main]
    paths: ['mac/**', 'android/**', '.github/workflows/apps.yml']
  workflow_dispatch:
    inputs:
      notes:
        description: 更新说明（可选）
        required: false

permissions:
  contents: write
  actions: write # to delete the build artifacts once released

concurrency:
  group: apps
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
    steps:
      # date + build number: always growing, nothing to keep track of (2026.10.8.12)
      - id: v
        run: |
          echo "version=$(TZ=Asia/Shanghai date +%Y.%-m.%-d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "code=$((20000 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"

  mac:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: VERSION=${{ needs.version.outputs.version }} ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: mac/build/tmux-web-mac.zip, retention-days: 1, compression-level: 0 }

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # the runner image has the Android SDK; make sure of the pieces this app builds with
      - name: 安卓 SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      # signed with the public key in the repository (android/release.jks)
      - name: 编译
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease -PversionName=${{ needs.version.outputs.version }} -PversionCode=${{ needs.version.outputs.code }}
          cp app/build/outputs/apk/release/app-release.apk ../tmux-web-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: tmux-web-android.apk, retention-days: 1, compression-level: 0 }

  release:
    needs: [version, mac, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: version.json 和发布说明
        env:
          NOTES_INPUT: ${{ github.event.inputs.notes }}
        run: |
          V=${{ needs.version.outputs.version }}
          NOTES="$NOTES_INPUT"
          # by default: the app changes since the last build
          [ -n "$NOTES" ] || NOTES=$(git log --format='- %s' -n 8 ${{ github.event.before || 'HEAD~1' }}..HEAD -- mac android 2>/dev/null | head -8)
          [ -n "$NOTES" ] || NOTES="App 更新"
          sha() { sha256sum "out/$1" | cut -d' ' -f1; }
          size() { stat -c %s "out/$1"; }
          python3 - "$V" "${{ needs.version.outputs.code }}" "$NOTES" "$(sha tmux-web-mac.zip)" "$(size tmux-web-mac.zip)" "$(sha tmux-web-android.apk)" "$(size tmux-web-android.apk)" > out/version.json <<'PY'
          import json, sys
          v, code, notes, msha, msize, asha, asize = sys.argv[1:]
          print(json.dumps({
            "version": v, "notes": notes,
            "mac": {"file": "tmux-web-mac.zip", "sha256": msha, "size": int(msize)},
            "android": {"file": "tmux-web-android.apk", "versionCode": int(code), "sha256": asha, "size": int(asize)},
          }, ensure_ascii=False, indent=2))
          PY
          cat > out/body.md <<MD
          **最近一次更新：$V**

          $NOTES

          ### 下载

          - **Mac**：[tmux-web-mac.zip](https://github.com/${{ github.repository }}/releases/latest/download/tmux-web-mac.zip)（Apple 芯片和 Intel，macOS 13 起）
            1. 解压，把 \`tmux-web.app\` 拖进「应用程序」
            2. **在终端执行一次**（App 没有苹果开发者签名，不执行的话系统会拦着不让打开）：
               \`\`\`
               xattr -c /Applications/tmux-web.app
               \`\`\`
          - **安卓**：[tmux-web-android.apk](https://github.com/${{ github.repository }}/releases/latest/download/tmux-web-android.apk)（Android 8 起）。下载后点开安装，系统可能会要求允许「安装未知应用」。

          ### 更新

          这个发布每次都会被新版本替换，下载链接不变。已经装好的 App 会自己检查新版本（通过你的 tmux-web 服务器，连不上时直接访问 GitHub），提示后一键更新。

          本项目按现状提供，不承担任何责任。安卓签名密钥是公开的，请只从这里下载安装包。
          MD
          cat out/version.json
      # one release, "latest": the old one goes, a new one in its place (and the old numbered ones)
      - name: 发布
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            case "$t" in latest|app-v*) gh release delete "$t" --yes --cleanup-tag || true ;; esac
          done
          gh release create latest out/tmux-web-mac.zip out/tmux-web-android.apk out/version.json \
            --target "$GITHUB_SHA" --title "tmux-web App（最新版）" --notes-file out/body.md --latest
      # the builds only pass through artifacts on the way to the release: don't keep them, this run's
      # or older runs' (storage is limited)
      - name: 删除临时构件
        if: always()
        run: |
          for id in $(gh api --paginate "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
          done
